http {
    client_max_body_size 100M;
    upstream backend {
        least_conn;
        server admin-006:3000;
    }

    upstream landing {
        least_conn;
        server landing-006:80;
    }

    server {
        listen 80;

        location ~ ^/(landing|_astro|favicon.svg) {
            proxy_pass http://landing;
            gzip on;
            gzip_types text/plain text/css application/json application/javascript text/html application/xml application/xml+rss text/javascript image/svg+xml;
            gzip_min_length 1k;
            gzip_comp_level 6;
            gzip_vary on;
            gzip_static on;
        }

        location / {
            proxy_pass http://backend;  # 将请求转发到后端
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Origin $http_origin;
        }
    }
}
events {
    worker_connections 1024;
}