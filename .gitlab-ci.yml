build:
  stage: build
  tags:
    - build
  only:
    - test
  script:
    - docker build -t 172.31.46.150:5555/admin-006:$CI_COMMIT_SHORT_SHA .
    - docker push 172.31.46.150:5555/admin-006:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  tags:
    - deploy
  only:
    - test
  script:
    - docker pull 172.31.46.150:5555/admin-006:$CI_COMMIT_SHORT_SHA
    - docker stop admin-006 || true
    - docker rm admin-006 || true
    - docker run -d -p 3333:3000 --name admin-006 --network demo --restart unless-stopped 172.31.46.150:5555/admin-006:$CI_COMMIT_SHORT_SHA
